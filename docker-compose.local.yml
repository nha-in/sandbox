volumes:
  sandbox_local_postgres_data: {}
  sandbox_local_postgres_data_backups: {}
  sandbox_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: sandbox_local_django
    container_name: sandbox_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: sandbox_production_postgres
    container_name: sandbox_local_postgres
    volumes:
      - sandbox_local_postgres_data:/var/lib/postgresql/data
      - sandbox_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '127.0.0.1:5434:5432'

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: sandbox_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:7.2
    container_name: sandbox_local_redis
    volumes:
      - sandbox_local_redis_data:/data

  tailwind:
    <<: *django
    image: sandbox_local_tailwind
    container_name: sandbox_local_tailwind
    depends_on: []
    ports: []
    command: /start-tailwind

  # Stand-in for ABDM's central-registry realm. Profile-gated: the fake adapter
  # covers day-to-day work, this is for exercising the real Admin API.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sandbox_local_keycloak
    profiles: ['keycloak']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    command: ['start-dev', '--import-realm', '--http-port=8080']
    volumes:
      - ./compose/local/keycloak:/opt/keycloak/data/import:z
    ports:
      - '8080:8080'

  celeryworker:
    <<: *django
    image: sandbox_local_celeryworker
    container_name: sandbox_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: sandbox_local_celerybeat
    container_name: sandbox_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: sandbox_local_flower
    container_name: sandbox_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
