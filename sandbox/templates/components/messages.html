{% if messages %}
  <div class="mb-6 space-y-3">
    {% for message in messages %}
      <div class="{% if message.level_tag == 'success' %}ui-alert-success{% elif message.level_tag == 'warning' %}ui-alert-warning{% elif message.level_tag == 'error' %}ui-alert-error{% else %}ui-alert-info{% endif %}"
           role="alert">{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
