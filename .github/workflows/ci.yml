name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['main']
    paths-ignore: ['docs/**']

  push:
    branches: ['main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  types:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://dummy
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version-file: '.python-version'

      - run: uv sync --locked

      - name: Type check
        run: uv run mypy sandbox config

      - name: Import contracts
        run: uv run lint-imports

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose --exit-code 1

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan dependencies and IaC for known issues
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      # When keep_local_envs_in_vcs is off, .envs/.local/* are not in the repo.
      # Create minimal dummy files so Docker Compose / Django / Postgres work in CI.
      - name: Ensure local env files exist for Docker Compose
        run: |
          mkdir -p .envs/.local
          if [ ! -f .envs/.local/.django ]; then
            cat <<'EOF' > .envs/.local/.django
          USE_DOCKER=yes
          IPYTHONDIR=/app/.ipython
          REDIS_URL=redis://redis:6379/0
          CELERY_FLOWER_USER=debug
          CELERY_FLOWER_PASSWORD=debug
          EOF
          fi
          if [ ! -f .envs/.local/.postgres ]; then
            cat <<'EOF' > .envs/.local/.postgres
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=ci
          POSTGRES_USER=debug
          POSTGRES_PASSWORD=debug
          EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache local backend
        uses: docker/bake-action@v6
        with:
          push: false
          load: true
          files: docker-compose.local.yml
          targets: django
          set: |
            django.cache-from=type=gha,scope=django-cached-tests
            django.cache-to=type=gha,scope=django-cached-tests,mode=max
            postgres.cache-from=type=gha,scope=postgres-cached-tests
            postgres.cache-to=type=gha,scope=postgres-cached-tests,mode=max

      - name: Build and cache docs
        uses: docker/bake-action@v6
        with:
          push: false
          load: true
          files: docker-compose.docs.yml
          set: |
            docs.cache-from=type=gha,scope=cached-docs
            docs.cache-to=type=gha,scope=cached-docs,mode=max

      # --database: without it the DB-level checks (index name length, etc) are
      # skipped, and the first thing to notice is the container refusing to boot.
      - name: Check Django Configuration
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py check --database default

      - name: Check DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py migrate

      # B9's suite points the real adapters at this. WIREMOCK_REQUIRED below
      # turns "the container is missing" from a skip into a failure.
      - name: Start WireMock
        run: |
          docker compose -f docker-compose.local.yml --profile wiremock up -d wiremock
          for _ in $(seq 1 30); do
            if docker compose -f docker-compose.local.yml exec -T wiremock \
              curl -sf http://localhost:8080/__admin/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "WireMock did not become healthy" >&2
          exit 1

      - name: Run Django Tests
        run: >
          docker compose -f docker-compose.local.yml run
          -e WIREMOCK_REQUIRED=1
          -e WIREMOCK_URL=http://wiremock:8080
          django pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: Tear down the Stack
        run: docker compose -f docker-compose.local.yml --profile wiremock down
