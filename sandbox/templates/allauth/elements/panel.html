{% load allauth %}

<section class="ui-card">
  <div class="ui-card-header">
    <h2 class="ui-section-title">
      {% slot title %}
      {% endslot %}
    </h2>
  </div>
  <div class="ui-card-body space-y-4">
    {% slot body %}
    {% endslot %}
  </div>
  {% if slots.actions %}
    <div class="ui-card-footer">{% for action in slots.actions %}{{ action }}{% endfor %}</div>
  {% endif %}
</section>
