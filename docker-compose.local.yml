volumes:
  sandbox_local_postgres_data: {}
  sandbox_local_postgres_data_backups: {}
  sandbox_local_redis_data: {}
  sandbox_local_minio_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: sandbox_local_django
    container_name: sandbox_local_django
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      # not just `minio`: the bucket is made by a one-shot service, and without
      # waiting for it every upload fails with NoSuchBucket.
      minio-createbucket:
        condition: service_completed_successfully
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: sandbox_production_postgres
    container_name: sandbox_local_postgres
    volumes:
      - sandbox_local_postgres_data:/var/lib/postgresql/data
      - sandbox_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '127.0.0.1:5434:5432'

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: sandbox_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:7.2
    container_name: sandbox_local_redis
    volumes:
      - sandbox_local_redis_data:/data

  # Declaration documents (A7). Private bucket, presigned GETs only — the
  # console port is for debugging, nothing in the portal links to it.
  minio:
    image: docker.io/minio/minio:latest
    container_name: sandbox_local_minio
    environment:
      MINIO_ROOT_USER: sandbox
      MINIO_ROOT_PASSWORD: sandbox-secret
    command: server /data --console-address ':9001'
    volumes:
      - sandbox_local_minio_data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'

  # Creates the bucket once and exits; `mb --ignore-existing` keeps it idempotent.
  minio-createbucket:
    image: docker.io/minio/mc:latest
    container_name: sandbox_local_minio_createbucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 sandbox sandbox-secret; do sleep 1; done;
      mc mb --ignore-existing local/sandbox-uploads;
      mc anonymous set none local/sandbox-uploads;
      "

  tailwind:
    <<: *django
    image: sandbox_local_tailwind
    container_name: sandbox_local_tailwind
    depends_on: []
    ports: []
    command: /start-tailwind

  # Stand-in for ABDM's central-registry realm. Profile-gated: the fake adapter
  # covers day-to-day work, this is for exercising the real Admin API.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sandbox_local_keycloak
    profiles: ['keycloak']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    command: ['start-dev', '--import-realm', '--http-port=8080']
    volumes:
      - ./compose/local/keycloak:/opt/keycloak/data/import:z
    ports:
      - '8080:8080'

  # B9's programmable network. Profiled, so an ordinary `just up` does not pay
  # for it; the suite that needs it skips when it is not there (and CI sets
  # WIREMOCK_REQUIRED so "skipped" cannot pass for "green").
  wiremock:
    image: wiremock/wiremock:3.13.2-3
    container_name: sandbox_local_wiremock
    profiles: ['wiremock']
    command: ['--disable-banner', '--local-response-templating']
    ports:
      # 8080 on the host belongs to Keycloak; inside the compose network the
      # django container still reaches this on 8080.
      - '8081:8080'

  celeryworker:
    <<: *django
    image: sandbox_local_celeryworker
    container_name: sandbox_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: sandbox_local_celerybeat
    container_name: sandbox_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: sandbox_local_flower
    container_name: sandbox_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
