{% load i18n %}

<header class="flex h-14 shrink-0 items-center justify-between gap-4 border-b border-border px-4 sm:px-8">
  <a href="{% url 'home' %}"
     class="text-sm font-semibold tracking-tight text-foreground">ABDM Sandbox</a>
  <nav class="flex items-center gap-1"
       aria-label="{% translate 'Primary' %}">
    <a class="ui-nav-link" href="{% url 'about' %}">{% translate "About" %}</a>
    {% if request.user.is_authenticated %}
      <a class="ui-btn ui-btn--secondary ui-btn--size-sm ml-2"
         href="{% url 'users:detail' request.user.external_id %}">{% translate "My account" %}</a>
    {% else %}
      <a id="log-in-link" class="ui-nav-link" href="{% url 'account_login' %}">{% translate "Sign in" %}</a>
      {% if ACCOUNT_ALLOW_REGISTRATION %}
        <a id="sign-up-link"
           class="ui-btn ui-btn--default ui-btn--size-sm ml-2"
           href="{% url 'account_signup' %}">{% translate "Register" %}</a>
      {% endif %}
    {% endif %}
  </nav>
</header>
